<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ذاكرة عمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <h1>ذاكرة عمر</h1>
  <p class="sub">هنولّع الأشكال بترتيب معين، إحفظه واضغط عليها بنفس الترتيب.</p>
  <div class="grid" id="grid">
    <div class="tile" data-shape="circle"><div class="shape"></div></div>
    <div class="tile" data-shape="square"><div class="shape"></div></div>
    <div class="tile" data-shape="triangle"><div class="shape"></div></div>
    <div class="tile" data-shape="diamond"><div class="shape"></div></div>
  </div>
  <div class="hint" id="memHint">بصّ كويس...</div>
  <div class="error" id="memErr"></div>
  <a class="action disabled" id="btn2" href="question.html">كمّل</a>
</div>
<script>
const tiles=[...document.querySelectorAll('.tile')];
const sequence=[1,3,0,2];
let userStep=0, playing=true;
const btn2=document.getElementById('btn2');
function flashTile(i,cb){
  tiles[i].classList.add('flash');
  setTimeout(()=>{ tiles[i].classList.remove('flash'); cb&&cb(); },420);
}
function playSequence(){
  playing=true; userStep=0;
  document.getElementById('memHint').textContent='بصّ كويس...';
  let i=0;
  function step(){
    if(i>=sequence.length){ playing=false; document.getElementById('memHint').textContent='دلوقتي جربك، دوس بنفس الترتيب'; return; }
    flashTile(sequence[i],()=>{ i++; setTimeout(step,180); });
  }
  setTimeout(step,500);
}
tiles.forEach((t,i)=>t.addEventListener('click',()=>{
  if(playing) return;
  flashTile(i);
  if(sequence[userStep]===i){
    userStep++;
    document.getElementById('memErr').textContent='';
    if(userStep===sequence.length){ btn2.classList.remove('disabled'); document.getElementById('memHint').textContent='تمام، دوس كمّل'; }
  } else {
    document.getElementById('memErr').textContent='مش هو الترتيب، جرب تاني';
    setTimeout(playSequence,900);
  }
}));
playSequence();
</script>
</body>
</html>

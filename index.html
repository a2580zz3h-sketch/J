<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TrebEdit — معاينة وتحرير المواقع</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neat.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&gt;_</span>
      <span class="brand-name">TrebEdit</span>
    </div>

    <div class="topbar-actions">
      <label class="btn btn-ghost" for="file-upload">
        استيراد ملفات
        <input type="file" id="file-upload" multiple hidden>
      </label>

      <div class="entry-picker">
        <span class="entry-label">صفحة البداية</span>
        <select id="entry-select"></select>
      </div>

      <button class="btn btn-primary" id="run-btn">
        <span class="run-icon">▶</span> تشغيل
      </button>
    </div>
  </header>

  <!-- ===== Mobile view switcher (hidden on wide screens) ===== -->
  <nav class="mobile-tabs" id="mobile-tabs">
    <button class="mobile-tab" data-view="files">الملفات</button>
    <button class="mobile-tab active" data-view="editor">المحرر</button>
    <button class="mobile-tab" data-view="preview">المعاينة</button>
  </nav>

  <!-- ===== Workspace ===== -->
  <main class="workspace" data-mobile-view="editor">

    <!-- Files rail -->
    <aside class="files-pane" data-pane="files">
      <div class="pane-heading">الملفات</div>
      <ul class="file-list" id="file-list"></ul>
      <button class="add-file-btn" id="add-file-btn">+ ملف جديد</button>
    </aside>

    <!-- Editor -->
    <section class="editor-pane" data-pane="editor">
      <div class="pane-heading editor-heading">
        <span id="active-file-name">index.html</span>
        <span class="dirty-dot" id="dirty-dot" hidden>●</span>
      </div>
      <div class="editor-host" id="editor-host"></div>
    </section>

    <!-- Live preview -->
    <section class="preview-pane" data-pane="preview">
      <div class="pane-heading preview-heading">
        <span>المعاينة</span>
        <label class="auto-toggle">
          <input type="checkbox" id="auto-run" checked>
          تحديث تلقائي
        </label>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="preview-frame" title="معاينة الموقع" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
      </div>
    </section>

  </main>

  <!-- ===== Side tab that opens the console ===== -->
  <button class="console-tab" id="console-tab" aria-label="فتح الكونسول">
    <span>الكاش</span>
  </button>

  <!-- ===== Console / cache panel ===== -->
  <aside class="console-panel" id="console-panel">
    <div class="console-header">
      <span class="console-title">شاشة تشغيل الموقع</span>
      <div class="console-actions">
        <button class="console-icon-btn" id="console-clear" title="مسح">مسح</button>
        <button class="console-icon-btn" id="console-close" title="إغلاق">✕</button>
      </div>
    </div>
    <div class="console-body" id="console-body"></div>
  </aside>
  <div class="console-backdrop" id="console-backdrop"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="script.js"></script>
</body>
</html>

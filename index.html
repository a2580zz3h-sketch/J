<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klein | الرفع الآمن الدائم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>🛡️ KLEIN SECURE UPLOAD</h2>
            <p>نظام الرفع الدائم - روابط لا تنتهي أبدًا</p>
        </header>

        <div class="upload-box" id="drop-zone">
            <input type="file" id="file-input" hidden>
            <div class="content" onclick="document.getElementById('file-input').click()">
                <span class="icon">🔒</span>
                <p>اسحب الملف هنا أو اضغط للاختيار</p>
                <small>حماية قصوى ضد الحذف أو التوقف</small>
            </div>
        </div>

        <div id="status" class="status-msg"></div>

        <div id="result-box" class="hidden">
            <input type="text" id="final-link" readonly>
            <button id="copy-btn" onclick="copyLink()">نسخ الرابط الدائم</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

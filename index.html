<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيد ميلاد عمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <h1>فيه حاجة مستنياك يا عمر</h1>
  <p class="sub">قبل ما توصل للمفاجأة، لازم تعدّي ٣ اختبارات صغيرة. ابدأ بالشمعة دي.</p>
  <div class="candle-wrap">
    <div class="candle" id="candle1"><div class="body"></div><div class="flame" id="flame1"></div></div>
  </div>
  <div class="counter" id="count">0 / 12</div>
  <div class="hint">دوس على الشمعة ١٢ مرة عشان تولّعها</div>
  <a class="action disabled" id="btn1" href="memory.html">كمّل</a>
</div>
<script>
let clicks=0; const need=12;
const candle1=document.getElementById('candle1'), flame1=document.getElementById('flame1'), count=document.getElementById('count'), btn1=document.getElementById('btn1');
candle1.addEventListener('click',()=>{
  if(clicks>=need) return;
  clicks++;
  count.textContent=clicks+' / '+need;
  if(clicks===need){ flame1.classList.add('lit'); btn1.classList.remove('disabled'); }
});
</script>
</body>
</html>

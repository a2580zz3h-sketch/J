<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>AXRL Media — Voice Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player">
    <header class="top">
      <div class="music-icon">♫</div>
      <div class="info">
        <div class="brand">AXRL MEDIA</div>
        <h1 id="title">Voice Player</h1>
        <span class="badge">ONLINE AUDIO</span>
      </div>
    </header>

    <section class="disc-wrap">
      <div class="disc" id="disc">
        <div class="disc-center">♫</div>
      </div>
    </section>

    <div class="wave" id="wave" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <section class="timeline">
      <button class="time" id="currentTime">0:00</button>
      <div class="track" id="track" role="slider" aria-label="تقدم الصوت" tabindex="0">
        <div class="fill" id="fill"></div>
      </div>
      <button class="time" id="duration">0:00</button>
    </section>

    <section class="controls">
      <button class="small" id="back" aria-label="رجوع 5 ثوان">↶</button>
      <button class="play" id="play" aria-label="تشغيل">▶</button>
      <button class="small" id="forward" aria-label="تقديم 5 ثوان">↷</button>
    </section>

    <section class="volume">
      <button class="mute" id="mute" aria-label="كتم الصوت">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="مستوى صوت الأغنية">
      <span id="volumeValue">80%</span>
    </section>

    <div class="status" id="status">اضغط ▶ لتشغيل الصوت</div>

    <audio id="audio" preload="metadata" playsinline></audio>

    <footer>AXRL MEDIA • AUDIO PLAYER</footer>
  </main>

  <script src="player.js"></script>
</body>
</html>
